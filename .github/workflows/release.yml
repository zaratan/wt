name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      # Single source of truth for bun/node/pnpm versions: mise.toml.
      - uses: jdx/mise-action@v4
      # Sync package.json version with the git tag so APP_VERSION (compiled
      # into the binary via src/version.ts) matches the release.
      - name: Sync package.json version with tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::Empty version derived from tag ${GITHUB_REF_NAME}"
            exit 1
          fi
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.version='${VERSION}'; fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build:darwin-arm64
      - name: Verify binary version matches tag
        run: |
          EXPECTED="${GITHUB_REF_NAME#v}"
          ACTUAL=$(./dist/wt-darwin-arm64 --version)
          if [[ "$ACTUAL" != "wt ${EXPECTED}" ]]; then
            echo "::error::Binary reports '${ACTUAL}' but tag is '${GITHUB_REF_NAME}'"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: wt-darwin-arm64
          path: dist/wt-darwin-arm64

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Single source of truth for bun/node/pnpm versions: mise.toml.
      - uses: jdx/mise-action@v4
      - name: Sync package.json version with tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::Empty version derived from tag ${GITHUB_REF_NAME}"
            exit 1
          fi
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.version='${VERSION}'; fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build:linux-x64
      - name: Verify binary version matches tag
        run: |
          EXPECTED="${GITHUB_REF_NAME#v}"
          ACTUAL=$(./dist/wt-linux-x64 --version)
          if [[ "$ACTUAL" != "wt ${EXPECTED}" ]]; then
            echo "::error::Binary reports '${ACTUAL}' but tag is '${GITHUB_REF_NAME}'"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: wt-linux-x64
          path: dist/wt-linux-x64

  release:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: wt-darwin-arm64
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: wt-linux-x64
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/wt-darwin-arm64 \
            dist/wt-linux-x64
